name: CD - Manual Deployment

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, Tag or Commit to deploy (e.g., develop, main, v1.0.0)'
        required: true
        default: 'main'
        type: string
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  manual-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build package
        run: uv build

      - name: Execute Manual Deployment
        run: |
          echo "🚀 Deploying ref '${{ inputs.target_ref }}' to environment '${{ inputs.environment }}'"
          # Añade aquí tus scripts de despliegue (SSH, Docker, AWS, servidor privado, etc.)
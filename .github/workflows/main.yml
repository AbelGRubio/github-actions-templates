name: Master Pipeline

on:
  push:
    branches: [ main, develop ]
    tags-ignore: [ 'v*' ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'feature/*'
  workflow_dispatch:

jobs:
  pre-commit:
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    uses: ./.github/workflows/pre-commit.yml

  test:
    needs: pre-commit
    uses: ./.github/workflows/test.yml
    secrets:
      PR_TOKEN_USER: ${{ secrets.PR_TOKEN }}

  sonar:
    needs: test
    uses: ./.github/workflows/sonarqube.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  approve-release:
    needs: sonar
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "Release approved by user"

  release:
    needs: approve-release
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/semantic-release.yml
    secrets:
      PR_TOKEN_USER: ${{ secrets.PR_TOKEN }}

  docs:
    needs: [test, release]
    if: |
      always() &&
      (needs.release.result == 'success') && needs.test.result == 'success' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml

  publish:
    needs: [ release ]
    if: |
      always() &&
      vars.ENABLE_PYPI_PUBLISH == 'true' &&
      needs.release.result == 'success' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      id-token: write
      contents: read
    uses:  ./.github/workflows/pypi-publish.yml

  # 5. Docker (Solo tras un nuevo Release exitoso)
  docker:
    needs: [test, release]
    if: |
      always() && github.event_name == 'push' &&
      vars.ENABLE_PYPI_PUBLISH == 'true' &&
      (github.ref == 'refs/heads/main' || needs.release.result == 'success')
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-publish.yml
    secrets: inherit
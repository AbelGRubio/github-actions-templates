# .github/workflows/main.yml
name: Master Pipeline CI

on:
  push:
    branches: [ main, develop ]
    tags-ignore: [ 'v*' ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'feature/*'
  workflow_dispatch:

jobs:
  check-pyproject:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for pyproject.toml
        id: check
        run: |
          if [ -f "pyproject.toml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "pyproject.toml found."
          else
            echo "::warning::pyproject.toml not found in root. Skipping Python-related jobs."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  pre-commit:
    needs: check-pyproject
    if: needs.check-pyproject.outputs.exists == 'true' && "!contains(github.event.head_commit.message, 'chore(release)')"
    uses: ./.github/workflows/pre-commit.yml

  test:
    needs: [check-pyproject, pre-commit]
    if: needs.check-pyproject.outputs.exists == 'true'
    uses: ./.github/workflows/test.yml
    secrets:
      PR_TOKEN_USER: ${{ secrets.PR_TOKEN }}

  sonar:
    needs: test
    if: needs.check-pyproject.outputs.exists == 'true'
    uses: ./.github/workflows/sonarqube.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  approve-release:
    needs: [check-pyproject, sonar]
    if: |
      needs.check-pyproject.outputs.exists == 'true' && (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
        (github.event_name == 'workflow_dispatch')
      )
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "Release approved by user"

  release:
    needs: [check-pyproject, approve-release]
    if: needs.check-pyproject.outputs.exists == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/semantic-release.yml
    secrets:
      PR_TOKEN_USER: ${{ secrets.PR_TOKEN }}

  docs:
    needs: [check-pyproject, test, release]
    if: |
      needs.check-pyproject.outputs.exists == 'true' &&
      always() &&
      (needs.release.result == 'success') && needs.test.result == 'success' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml

  publish:
    needs: [check-pyproject, release]
    if: |
      needs.check-pyproject.outputs.exists == 'true' &&
      always() &&
      vars.ENABLE_PYPI_PUBLISH == 'true' &&
      needs.release.result == 'success' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      id-token: write
      contents: read
    uses:  ./.github/workflows/pypi-publish.yml

  docker:
    needs: [check-pyproject, test, release]
    if: |
      needs.check-pyproject.outputs.exists == 'true' &&
      always() && github.event_name == 'push' &&
      vars.ENABLE_PYPI_PUBLISH == 'true' &&
      (github.ref == 'refs/heads/main' || needs.release.result == 'success')
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-publish.yml
    secrets: inherit
name: CD - Release & Deploy

on:
  push:
    branches:
      - master
      - develop
      - 'feature/*'

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Lint & Test
        run: |
          uv run ruff check .
          uv run pytest

  semantic-release:
    needs: quality-and-test
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v8.5.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish-artifact:
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Build Package with uv
        run: uv build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ needs.semantic-release.outputs.version }}
          path: dist/

  deploy:
    needs: [semantic-release, build-and-publish-artifact]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Environment
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "Deploying official release ${{ needs.semantic-release.outputs.version }} to PRODUCTION..."
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "Deploying pre-release ${{ needs.semantic-release.outputs.version }} to STAGING/QA..."
          fi
